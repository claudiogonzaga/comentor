appId: com.claudiogonzaga.comentor
name: "AIChoice: API key inválida deve mostrar erro (não crashar)"
tags:
  - chat
  - error-handling
---
- clearState
- launchApp
- extendedWaitUntil:
    visible: "Me conta mais.*"
    timeout: 15000
- tapOn: "Me conta mais.*"
- tapOn: "Gostei.*"
- tapOn: "Vamos começar.*"
- extendedWaitUntil:
    visible: "Como te chamo.*"
    timeout: 8000
- tapOn:
    text: "Seu nome ou apelido"
    optional: true
- inputText: "TestUser"
- hideKeyboard
- tapOn: "Brutalmente honesta"
- scrollUntilVisible:
    element:
      text: "Continuar.*"
    direction: DOWN
- tapOn: "Continuar.*"
- extendedWaitUntil:
    visible: "Como você quer usar.*"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "Usar API.*"
    direction: DOWN
    optional: true
# O caminho de API agora oferece Claude (padrão) ou Gemini: troca para o Gemini.
- runFlow:
    when:
      visible: "Usar API.*"
    commands:
      - tapOn: "Usar API.*"
      - tapOn: "Gemini \\(Google\\)"
      - extendedWaitUntil:
          visible: "cole aqui sua chave"
          timeout: 5000
      - tapOn:
          text: "cole aqui sua chave"
          optional: true
      - inputText: "AIzaSyDUMMY_INVALID_KEY_FOR_TEST_ONLY"
      - hideKeyboard
      - tapOn:
          text: "Testar chave"
          optional: true
      - takeScreenshot: "05_invalid_key_error"
- takeScreenshot: "05_final_state"
