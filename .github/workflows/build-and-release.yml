name: Build APK e publicar release

# Robô que assa o APK na EAS e publica a release no GitHub automaticamente.
#
# Quando roda:
#   - Automaticamente, a cada push na branch `main` (ex.: ao mergear um PR).
#   - Manualmente, pela aba "Actions" -> "Run workflow".
#   - Mudanças que mexem só em arquivos .md NÃO disparam o robô.
#
# O robô só builda quando a versão em app.json (expo.version) ainda não tem
# release publicada. Ou seja: para gerar uma versão nova, suba o número da
# versão em app.json. Se a release daquela versão já existir, o robô apenas
# registra um aviso e encerra, sem gastar build da EAS.
#
# Para forçar a regeração de uma versão que já existe: apague a release e a
# tag correspondente no GitHub e rode de novo.
#
# Pré-requisito (feito uma vez): criar o secret EXPO_TOKEN no repositório
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Name: EXPO_TOKEN   Value: token gerado em expo.dev/settings/access-tokens

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      notes:
        description: 'Texto que aparece na release do GitHub'
        required: false
        default: 'Nova versão do CoMentor'

# Um push novo cancela o run anterior que ainda estiver de pé, em vez de deixar
# os dois disputando o mesmo build.
concurrency:
  group: build-and-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Sem isto, um Gradle travado fica pendurado até o teto de 6 h do GitHub —
    # foi o que aconteceu em 13 runs seguidos. O build saudável leva ~10 min.
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ler a versão e checar se a release já existe
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release v$VERSION ja existe — nada a buildar. Suba expo.version em app.json para gerar uma nova versao."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Versao nova (v$VERSION) — iniciando o build."
          fi

      - name: Instalar dependências
        if: steps.ver.outputs.build == 'true'
        run: npm install --no-audit --no-fund

      - name: Configurar a EAS CLI
        if: steps.ver.outputs.build == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Histórico, para não se repetir: enquanto este passo usava '--local', o
      # ':expo-updates:kspReleaseKotlin' estourava com OutOfMemoryError:
      # Metaspace nos defaults do Gradle, e o daemon travado deixava o job
      # pendurado até o teto de 6 h — 13 runs cancelados em sequência.
      # Compilar na nuvem elimina isso junto com o vazamento de credenciais:
      # não há Gradle, JDK nem keystore no runner.

      # Build LOCAL no próprio runner do GitHub (Ubuntu, ~14 GB livres, Android
      # SDK pré-instalado). NÃO consome a cota mensal de builds na nuvem da EAS
      # — só busca as credenciais remotas (keystore), o que é gratuito. Resolve
      # tanto a cota esgotada quanto o disco cheio do Mac local.
      - name: Buildar o APK na nuvem da EAS
        if: steps.ver.outputs.build == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -o pipefail
          # SEGURANÇA — POR QUE NUVEM E NÃO '--local'.
          #
          # Este repositório é PÚBLICO, e os logs do Actions também são. O
          # 'eas build --local' precisa baixar o keystore de assinatura para o
          # runner, e quando o build falha ele imprime o job inteiro no stdout —
          # keystore em base64, senha do keystore, alias e senha da chave. Foi
          # exatamente isso que expôs as credenciais nos runs de 05/07/2026.
          #
          # No build em nuvem as credenciais nunca deixam os servidores da EAS:
          # o runner só recebe a URL do APK pronto. O vazamento deixa de ser
          # algo a filtrar e passa a ser impossível por construção.
          #
          # Custo: consome a cota mensal de builds da EAS. Se a cota virar o
          # gargalo, a alternativa segura NÃO é voltar para o --local aqui — é
          # buildar na máquina local e publicar com scripts/release.sh.
          # stdout e stderr SEPARADOS: com --json o stdout é JSON puro, mas a EAS
          # escreve progresso e avisos no stderr. Juntar os dois (2>&1) corrompe
          # o JSON — foi o que quebrou o run 30751524329.
          set +e
          eas build --platform android --profile preview --non-interactive --wait --json \
            > build.json 2> build.err
          STATUS=$?
          set -e
          # O stderr é informativo e deve aparecer no log, mas redigido: se algum
          # dia a EAS voltar a imprimir o blob do job, ele não vaza.
          sed -E 's#eyJqb2Ii[A-Za-z0-9+/=]{100,}#[REDIGIDO]#g' build.err >&2 || true
          if [ $STATUS -ne 0 ]; then
            echo "::error::eas build terminou com codigo $STATUS"
            exit $STATUS
          fi
          APK_URL=$(jq -r '(if type=="array" then .[0] else . end)
                           | .artifacts.applicationArchiveUrl // .artifacts.buildUrl // ""' build.json)
          if [ -z "$APK_URL" ]; then
            echo '::error::A EAS nao devolveu URL de artefato.'
            head -c 2000 build.json >&2
            exit 1
          fi
          echo "Baixando APK de $APK_URL"
          curl -fsSL "$APK_URL" -o "${{ github.workspace }}/comentor-${{ steps.ver.outputs.version }}.apk"
          ls -lh "${{ github.workspace }}/comentor-${{ steps.ver.outputs.version }}.apk"

      - name: Publicar release no GitHub
        if: steps.ver.outputs.build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: CoMentor v${{ steps.ver.outputs.version }}
          body: ${{ inputs.notes || 'Nova versão do CoMentor' }}
          files: comentor-${{ steps.ver.outputs.version }}.apk
