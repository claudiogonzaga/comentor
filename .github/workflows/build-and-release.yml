name: Build APK e publicar release

# Robô que assa o APK na EAS e publica a release no GitHub automaticamente.
#
# Quando roda:
#   - Automaticamente, a cada push na branch `main` (ex.: ao mergear um PR).
#   - Manualmente, pela aba "Actions" -> "Run workflow".
#   - Mudanças que mexem só em arquivos .md NÃO disparam o robô.
#
# O robô só builda quando a versão em app.json (expo.version) ainda não tem
# release publicada. Ou seja: para gerar uma versão nova, suba o número da
# versão em app.json. Se a release daquela versão já existir, o robô apenas
# registra um aviso e encerra, sem gastar build da EAS.
#
# Para forçar a regeração de uma versão que já existe: apague a release e a
# tag correspondente no GitHub e rode de novo.
#
# Pré-requisito (feito uma vez): criar o secret EXPO_TOKEN no repositório
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Name: EXPO_TOKEN   Value: token gerado em expo.dev/settings/access-tokens

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      notes:
        description: 'Texto que aparece na release do GitHub'
        required: false
        default: 'Nova versão do CoMentor'

# Um push novo cancela o run anterior que ainda estiver de pé, em vez de deixar
# os dois disputando o mesmo build.
concurrency:
  group: build-and-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Sem isto, um Gradle travado fica pendurado até o teto de 6 h do GitHub —
    # foi o que aconteceu em 13 runs seguidos. O build saudável leva ~10 min.
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ler a versão e checar se a release já existe
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release v$VERSION ja existe — nada a buildar. Suba expo.version em app.json para gerar uma nova versao."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Versao nova (v$VERSION) — iniciando o build."
          fi

      - name: Configurar Java 17 (necessário para o build local)
        if: steps.ver.outputs.build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependências
        if: steps.ver.outputs.build == 'true'
        run: npm install --no-audit --no-fund

      - name: Configurar a EAS CLI
        if: steps.ver.outputs.build == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # CAUSA RAIZ das falhas anteriores: ':expo-updates:kspReleaseKotlin'
      # estourava com 'java.lang.OutOfMemoryError: Metaspace' nos defaults do
      # Gradle. Quando não morria, o daemon travava e o job ficava pendurado
      # até o teto de 6 h.
      #
      # O gradle.properties do GRADLE_USER_HOME tem precedência sobre o do
      # projeto, então dá para ajustar a memória sem tocar no app.json nem
      # alterar o fingerprint nativo. O runner tem 16 GB.
      #
      # org.gradle.daemon=false: em CI o daemon não é reaproveitado entre runs,
      # e sem ele some toda a classe de erro "Could not receive a message from
      # the daemon".
      - name: Ajustar memória do Gradle e do Kotlin
        if: steps.ver.outputs.build == 'true'
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g"
            echo "kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g"
            echo "org.gradle.daemon=false"
          } >> ~/.gradle/gradle.properties
          echo "--- ~/.gradle/gradle.properties ---"
          cat ~/.gradle/gradle.properties

      # Build LOCAL no próprio runner do GitHub (Ubuntu, ~14 GB livres, Android
      # SDK pré-instalado). NÃO consome a cota mensal de builds na nuvem da EAS
      # — só busca as credenciais remotas (keystore), o que é gratuito. Resolve
      # tanto a cota esgotada quanto o disco cheio do Mac local.
      - name: Buildar o APK localmente no runner
        if: steps.ver.outputs.build == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -o pipefail
          # SEGURANÇA — NÃO REMOVER ESTE FILTRO.
          # Quando o build falha, o 'eas build --local' imprime o job inteiro no
          # stdout, e dentro dele vão o keystore de assinatura em base64, a senha
          # do keystore, o alias e a senha da chave. Este repositório é público,
          # então isso vira credencial exposta na internet — foi o que aconteceu
          # nos runs de 05/07/2026.
          # O sed redige o blob antes de ele virar log. Usa-se sed (e não grep)
          # porque o sed sempre sai com código 0; o 'set -o pipefail' acima
          # preserva o código de saída real do eas.
          eas build --platform android --profile preview --local --non-interactive \
            --output "${{ github.workspace }}/comentor-${{ steps.ver.outputs.version }}.apk" \
            2>&1 | sed -E 's#eyJqb2Ii[A-Za-z0-9+/=]{100,}#[BLOB DO JOB REDIGIDO — CONTINHA O KEYSTORE]#g'

      - name: Publicar release no GitHub
        if: steps.ver.outputs.build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: CoMentor v${{ steps.ver.outputs.version }}
          body: ${{ inputs.notes || 'Nova versão do CoMentor' }}
          files: comentor-${{ steps.ver.outputs.version }}.apk
